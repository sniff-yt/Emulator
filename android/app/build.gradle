plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

android {
    namespace "com.example.pc_emulator"
    compileSdk 35
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.example.pc_emulator"
        minSdk 26
        // targetSdk 28 keeps exec() of helper binaries from the app's data dir allowed
        // (W^X restriction applies from 29). proot itself runs from nativeLibraryDir.
        targetSdk 28
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        ndk { abiFilters 'arm64-v8a' }
    }

    packagingOptions {
        jniLibs {
            // proot + loader must exist as real files in nativeLibraryDir so they can be exec'd
            useLegacyPackaging true
        }
    }

    lint {
        // Sideloaded app: targetSdk 28 is intentional (exec of helper binaries).
        disable 'ExpiredTargetSdkVersion'
        checkReleaseBuilds false
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    implementation 'org.apache.commons:commons-compress:1.26.2'
}

flutter {
    source '../..'
}
