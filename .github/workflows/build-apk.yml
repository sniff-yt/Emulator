name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      # The Flutter project lives at the repo root (no subfolder).
      - name: Get dependencies
        run: flutter pub get

      - name: Bundle proot
        run: bash scripts/fetch_proot.sh "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a"

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64 --build-number ${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }}

      - name: Locate APK
        if: always()
        run: find build android -type f -name '*.apk' -print || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pc-emulator-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish latest APK
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk PC-Emulator.apk
          NOTES="build ${{ github.run_number }} from ${GITHUB_SHA::7}. Install the APK, open it, tap Install to set up the engine."
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "PC Emulator (latest build)" --notes "$NOTES" --latest
          for t in 1 2 3 4; do gh release upload latest PC-Emulator.apk --clobber && break; echo "retry $t"; sleep 15; done
          gh release edit latest --draft=false --latest --notes "$NOTES"
