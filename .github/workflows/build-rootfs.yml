name: Build ready-made Linux image

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'assets/runtime/**'
      - 'remote/config.json'
      - 'scripts/build_rootfs.sh'
      - '.github/workflows/build-rootfs.yml'

permissions:
  contents: write

concurrency:
  group: rootfs
  cancel-in-progress: true

jobs:
  rootfs:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build image (full setup done here instead of on the phone)
        run: |
          mkdir -p out
          docker run --rm -e GITHUB_SHA -v "$PWD:/src:ro" -v "$PWD/out:/out" debian:trixie-slim bash /src/scripts/build_rootfs.sh
          ls -la out
          test -s out/rootfs-arm64.tar.gz
      - name: Publish image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view rootfs >/dev/null 2>&1 || gh release create rootfs --title "Ready-made Linux image" --notes "starting" --latest=false
          for f in out/rootfs-arm64.tar.gz out/setup.log; do
            for t in 1 2 3 4; do gh release upload rootfs "$f" --clobber && break; echo "retry $t"; sleep 20; done
          done
          gh release edit rootfs --draft=false --latest=false --notes "Debian + box64 + Wine + Turnip + DXVK + desktop + Firefox, already set up. Built from ${GITHUB_SHA::7}."
